
services:
  kafka:
    image: apache/kafka:4.1.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1
      interval: 15s
      timeout: 30s
      retries: 5
      start_period: 60s

  outbox-publisher:
    build:
      context: ./backend
    container_name: ecommerce-outbox-publisher
    env_file:
      - ./backend/.env.docker
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "-m", "src.kafka.outbox_publisher"]
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      disable: true

  notification-consumer:
    build:
      context: ./backend
    container_name: ecommerce-notification-consumer
    env_file:
      - ./backend/.env.docker
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_CONSUMER_GROUP: notification-group
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "-m", "src.kafka.consumer"]
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      disable: true

  backend:
    build:
      context: ./backend
    container_name: ecommerce-api
    env_file:
      - ./backend/.env.docker
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      kafka:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: ecommerce-frontend
    env_file:
      - ./frontend/.env.docker
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  kafka_data:
    external: true
    name: c9729015389bfca93e40e99d586704b8898ad9da34d4777c8773e16983494506
