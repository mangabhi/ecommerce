
name: E-commerce CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: "sqlite:///./test.db"
      SECRET_KEY: "ci-test-only-secret-key-not-for-production"
      ALGORITHM: "HS256"
      EXP_TIME: "30"
      REFRESH_EXP_TIME: "7"
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backend tests
        run: python -m pytest tests/ -v


  frontend-checks:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build


  publish-images:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-checks]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ecommerce-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/ecommerce-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ecommerce-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/ecommerce-frontend:latest
  
  deploy-to-kubernetes:
    runs-on: [self-hosted, Windows, X64]
    needs: [backend-tests, frontend-checks, publish-images]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy backend
        shell: powershell
        run: |
          kubectl set image deployment/backend backend=ghcr.io/mangabhi/ecommerce-backend:${{ github.sha }} -n ecommerce
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Deploy frontend
        shell: powershell
        run: |
          kubectl set image deployment/frontend frontend=ghcr.io/mangabhi/ecommerce-frontend:${{ github.sha }} -n ecommerce
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Wait for rollout
        shell: powershell
        run: |
          kubectl rollout status deployment/backend -n ecommerce --timeout=180s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          kubectl rollout status deployment/frontend -n ecommerce --timeout=180s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
